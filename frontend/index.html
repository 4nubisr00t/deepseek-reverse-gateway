<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Anubis Gateway · DeepSeek 逆向高并发网关与圣殿中枢 (AppIcon)</title>
    <!-- AppIcon Zero-Emoji SVG Engineering Component Included -->
    <!-- Tailwind CSS CDN with configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#090d16',
                card: '#111726',
                border: '#1e293b',
                primary: '#10b981',
                cyan: '#06b6d4',
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
      --bg-abyss: #05080f;
      --bg-surface: #0a0f1d;
      --bg-elevated: #0f172a;
      --gold-primary: #f59e0b;
      --gold-light: #fcd34d;
      --emerald-primary: #10b981;
      --cyan-primary: #06b6d4;
    }
    body {
      background-color: var(--bg-abyss);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -15%, rgba(16, 185, 129, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 85% 10%, rgba(245, 158, 11, 0.06), transparent);
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      overflow-x: hidden;
    }
    .font-mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    .font-sacred {
      font-family: 'Cinzel', 'Inter', serif;
      letter-spacing: 0.04em;
    }
    .glass-panel {
      background: rgba(11, 17, 30, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    }
    .glass-card-hover {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card-hover:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 34px -10px rgba(0, 0, 0, 0.75), inset 0 1px 0 0 rgba(255, 255, 255, 0.09);
    }
    .owner-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(245, 158, 11, 0.14);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .acct-chip {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      margin: 1px 3px 1px 0;
      border-radius: 5px;
      font-size: 10.5px;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.28);
    }
    .sacred-terminal {
      background: #03060c;
      border: 1px solid rgba(30, 41, 59, 0.9);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .term-line {
      word-break: break-all;
      white-space: pre-wrap;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .term-line:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    .term-success { color: #34d399; }
    .term-error { color: #f87171; background: rgba(239, 68, 68, 0.07); }
    .term-warn { color: #fbbf24; }
    .term-cold { color: #38bdf8; }
    .term-cascade { color: #c084fc; background: rgba(192, 132, 252, 0.08); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(6, 10, 19, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.5); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.7); }
    </style>
  </head>
  <body class="bg-[#05080f] text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-black">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
