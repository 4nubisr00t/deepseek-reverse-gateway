; ds-gateway 测试收集配置
;
; ## 为什么必须显式写这个文件
;
; 仓库此前**没有任何 pytest 配置**，于是裸 `pytest` 会从仓库根递归收集 —— 包括
; `tools/`。而 `tools/` 下有 3 个探针脚本名字正好是 `test_*.py`：
;
;     tools/test_abort_repro.py
;     tools/test_stop_stream_live.py
;     tools/test_wip_recovery.py
;
; 它们的末尾原本是**模块级** `asyncio.run(run_test())` —— 被 import 的那一刻就开跑，
; 而 `run_test()` 会调用 `DeepSeekClient.create_chat_session(token, cookie)`：
; **真实的上游请求**。（实测：显式 `pytest tools/` 确实打到了上游，报
; DeepSeekAuthError，不是本地错误。）
;
; 本地之所以没炸成事故，只是因为 config.json 是假账号（`a@x`），撞在
; `cfg['accounts'][0]` 抛 IndexError 上。**生产机上 config.json 有 25 个真账号**，
; 在那里跑一次裸 `pytest` 就是三次真实上游请求。
;
; 这不是洁癖问题：2026-09-11 两个账号被禁言 24 小时，主因就是非必要的生成流量
; （对单账号并发压测 + 一小时 353 次校验请求）。工具链自身绝不能再制造这种事。
;
; ## 两道防线，各自负责不同的入口（别把它们说成互为备份）
;
; 1. **本文件的 testpaths** —— 挡的是"裸 `pytest`"这个最常见入口。
; 2. **那 3 个脚本里的 `if __name__ == "__main__":` 保护** —— 挡的是"被 import"。
;
; ⚠️ 实测结论：**`norecursedirs` 挡不住显式 `pytest tools/`**。
; 当目录被当作参数直接写在命令行上时，pytest 仍会进去收集。
; 所以真正的兜底是第 2 道（脚本不再在 import 时干活），而不是这里的配置 ——
; 本文件也**不再**声称自己是双保险。
;
; ## 不做什么
;
; 不设 python_classes / python_functions / addopts —— 现有用例全部是
; unittest.TestCase 子类，pytest 无论如何都会收集，这些设置只会引入
; 无谓的行为变化。这个文件只为"默认收集范围"这一件事负责。

[pytest]
; 测试只住在 tests/。裸 pytest 不再向 tools/ 递归。
testpaths = tests

; 显式设置会**替换** pytest 的默认值，所以下面把默认项一并列出。
; 对 tools/ 的作用仅限于"递归时跳过"，不覆盖命令行显式指定的路径。
norecursedirs = tools .* build dist *.egg node_modules venv __pycache__
